<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
<title>Watch Later</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <header class="header">
    <div>
      <h1>Watch Later</h1>
      <p class="muted" id="summary">TikTok &amp; Instagram videos to get to.</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" id="shuffleBtn" type="button"><svg class="i"><use href="#i-shuffle"/></svg>Shuffle</button>
      <div class="menu">
        <button class="btn btn-outline btn-icon" id="menuBtn" type="button" aria-label="More" aria-haspopup="true"><svg class="i"><use href="#i-more"/></svg></button>
        <div class="menu-panel" id="menuPanel" hidden>
          <button type="button" data-menu="export"><svg class="i"><use href="#i-download"/></svg>Export backup (.json)</button>
          <button type="button" data-menu="import"><svg class="i"><use href="#i-upload"/></svg>Import backup (.json)</button>
          <button type="button" data-menu="refresh"><svg class="i"><use href="#i-rotate"/></svg>Refresh thumbnails</button>
        </div>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </header>

  <form class="card add" id="addForm" autocomplete="off">
    <textarea id="addInput" rows="1" placeholder="Paste TikTok / Instagram links…" aria-label="Video links"></textarea>
    <button class="btn btn-primary" type="submit"><svg class="i"><use href="#i-plus"/></svg>Add</button>
  </form>

  <div id="favBanner"></div>

  <nav class="tabs" id="tabs" aria-label="Lists">
    <button type="button" data-filter="todo">To watch <span class="count"></span></button>
    <button type="button" data-filter="watched">Watched <span class="count"></span></button>
    <button type="button" data-filter="fav">Favorites <span class="count"></span></button>
    <button type="button" data-filter="all">All <span class="count"></span></button>
    <button type="button" data-filter="bin">Recently deleted <span class="count"></span></button>
  </nav>

  <div class="toolbar">
    <div class="search"><svg class="i"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Search titles…" aria-label="Search"></div>
    <select id="cat" class="select" aria-label="Category"></select>
    <select id="sort" class="select" aria-label="Sort">
      <option value="newest">Newest bookmarked</option>
      <option value="oldest">Oldest bookmarked</option>
      <option value="title">Title A–Z</option>
      <option value="category">By category</option>
      <option value="lastwatched">Recently watched</option>
      <option value="rewatched">Most rewatched</option>
    </select>
    <div class="segmented" role="group" aria-label="View">
      <button type="button" data-view="grid" aria-label="Grid view"><svg class="i"><use href="#i-grid"/></svg></button>
      <button type="button" data-view="list" aria-label="List view"><svg class="i"><use href="#i-list"/></svg></button>
    </div>
  </div>

  <main id="out"></main>
</div>

<dialog id="shuffleDlg" class="dialog">
  <div class="dialog-head">
    <h2>Watch this</h2>
    <button class="btn btn-ghost btn-icon" type="button" data-close aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button>
  </div>
  <div class="segmented wide" role="group" aria-label="Shuffle from">
    <button type="button" data-pool="todo">To watch</button>
    <button type="button" data-pool="fav">Favorites</button>
    <button type="button" data-pool="any">Anything</button>
  </div>
  <div id="pick"></div>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M11.5 2.3a.5.5 0 0 1 1 0l2.3 4.7a2 2 0 0 0 1.6 1.1l5.2.8a.5.5 0 0 1 .3.9l-3.8 3.6a2 2 0 0 0-.6 1.9l.9 5.2a.5.5 0 0 1-.8.6l-4.6-2.5a2 2 0 0 0-2 0l-4.6 2.5a.5.5 0 0 1-.8-.6l.9-5.2a2 2 0 0 0-.6-1.9L1.1 9.8a.5.5 0 0 1 .3-.9l5.2-.8a2 2 0 0 0 1.6-1.1z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M21.2 6.8a2.8 2.8 0 0 0-4-4L3.8 16.2a2 2 0 0 0-.5.8l-1.3 4.4a.5.5 0 0 0 .6.6l4.4-1.3a2 2 0 0 0 .8-.5z"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m6 3 14 9-14 9z"/></symbol>
  </defs>
</svg>
<script src="app.js"></script>
</body>
</html>
